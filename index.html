<style>
:root{--bg:#f4f5f7;--card:#fff;--ink:#1d2330;--sub:#6b7280;--line:#e3e6ea;--pt:#2f6fed;--bad:#d64545}

 min-height:100vh;display:flex;align-items:center;justify-content:center;padding:16px;box-sizing:border-box}

button{width:100%;margin-top:10px;font-size:15px;padding:12px;border:0;border-radius:10px;background:var(--pt);color:#fff;font-weight:600;cursor:pointer}
button:disabled{opacity:.6}
label{display:flex;gap:6px;align-items:center;font-size:13px;color:var(--sub);margin-top:12px}
#err{color:var(--bad);font-size:13px;min-height:18px;margin-top:8px}

const K='chabot_pw';
const u8=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function open_(pw){
  const base=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);
  const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:u8(D.salt),iterations:D.it,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['decrypt']);
  const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:u8(D.iv)},key,u8(D.ct));
  const ds=new Blob([pt]).stream().pipeThrough(new DecompressionStream('gzip'));return await new Response(ds).text();
}
function show(html){document.open();document.write(html);document.close();}
const f=document.getElementById('f'),err=document.getElementById('err'),go=document.getElementById('go');
f.addEventListener('submit',async e=>{
  e.preventDefault();const pw=document.getElementById('pw').value;if(!pw)return;
  go.disabled=true;go.textContent='여는 중…';err.textContent='';
  try{const h=await open_(pw);
    try{document.getElementById('rm').checked?localStorage.setItem(K,pw):localStorage.removeItem(K);}catch(_){}
    show(h);
  }catch(_){err.textContent='비밀번호가 맞지 않습니다';go.disabled=false;go.textContent='열기';}
});
(async()=>{let s=null;try{s=localStorage.getItem(K);}catch(_){}
  if(s){go.disabled=true;go.textContent='여는 중…';
    try{show(await open_(s));}catch(_){try{localStorage.removeItem(K);}catch(__){}go.disabled=false;go.textContent='열기';err.textContent='비밀번호가 바뀌었습니다. 다시 입력하십시오';}}
})();
})();
